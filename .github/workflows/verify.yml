name: Quarry correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision pinned local dependencies
        run: python3.12 tools/bootstrap.py
      - name: Offline Debug, Release, and sanitizer correctness gates
        run: .venv/bin/python tools/verify.py --profile core
      - name: Preserve exact logs, case identities, receipts, and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarry-core-${{ matrix.os }}
          path: |
            build/verification/
            build/*/Testing/Temporary/LastTest.log
          if-no-files-found: warn
